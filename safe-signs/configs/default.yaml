# GTSRB: unzip the training set (and optionally the test images + GT-final_test.csv) into data/gtsrb
data_dir: data/gtsrb
image_size: 32
max_per_class: null      # e.g. 600 to train faster on CPU
seed: 0

# CNN training (NumPy, CPU)
epochs: 8
batch: 128
lr: 0.001

# Evaluation and attacks
n_eval: 3000             # test images used for attacks and decisions
eps_255: 8               # L-infinity budget for FGSM/PGD, in pixel levels out of 255
pgd_steps: 10
patch_size: 8            # sticker attack: an unbounded 8x8 patch
patch_steps: 20

# Decision layer
tau: 0.6                 # below this confidence the system falls back to caution
plausible_eps: 0.02      # signs with at least this probability count as plausible in the fallback
context_noise: [0.0, 0.1, 0.2]
n_boot: 1000

# Improvements
adv_training: true       # also train a PGD adversarially trained CNN as a baseline (slow: about 2-3x normal training)
adv_epochs: 6
adv_steps: 3
tau_grid: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95]
extra_seeds: [1, 2]      # retrain the standard CNN with these seeds to measure training-seed variation
soft_alpha: 20           # soft rules: weight = (violations + alpha*prior) / (real signs + alpha)
soft_prior: 0.01
# Round four: stronger attacks and analysis
n_stress: 600            # images for the rule-aware adaptive attack, map spoofing and the eps sweep
adaptive_steps: 30       # PGD steps per target in the adaptive attack
adaptive_targets: 3      # rule-consistent unsafe targets tried per image
eps_sweep: [2, 4, 8, 16] # attack budgets for the strength curve (pixel levels out of 255)
envelope_random: 1000    # random network outputs per context in the envelope check
# Real map contexts: run scripts/build_osm_contexts.py first; data/osm_contexts.json is then used automatically

output_dir: results/main
